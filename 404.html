 to use it as a pet."}},{"@type":"Question","name":"How is Pawse different from other water or break reminder apps?","acceptedAnswer":{"@type":"Answer","text":"Most reminder apps send notifications that are easy to swipe away. Pawse combines water tracking, habit reminders on any interval and screen-time breaks in one app, delivered by an animated pet with expressions and sounds, plus an optional hard block for habits you're serious about."}}]},{"@type":"HowTo","@id":"https://salahu01.github.io/pawse/#install","name":"How to install Pawse on a Mac","totalTime":"PT1M","step":[{"@type":"HowToStep","position":1,"name":"Download","text":"Download the latest Pawse .dmg from GitHub Releases."},{"@type":"HowToStep","position":2,"name":"Install","text":"Open the .dmg and drag Pawse into your Applications folder."},{"@type":"HowToStep","position":3,"name":"Open","text":"Open Pawse. It lives in the menu bar, and your pet walks in to say hi. On first launch, if macOS cannot verify the developer, right-click Pawse → Open → Open."}]}]}</script><script src="/pawse/_next/static/chunks/3l04zcqx63h3y.js" id="_R_" async=""></script><script>(self.__next_f=self.__next_f||[]).push([0])</script><script>self.__next_f.push([1,"1:\"$Sreact.fragment\"\n2:I[39756,[\"/pawse/_next/static/chunks/3fntmmi971322.js\"],\"default\"]\n3:I[37457,[\"/pawse/_next/static/chunks/3fntmmi971322.js\"],\"default\"]\n9:I[68027,[\"/pawse/_next/static/chunks/3fntmmi971322.js\"],\"default\",1]\n:HL[\"/pawse/_next/static/chunks/3daevpt1_dygl.css\",\"style\"]\n4:T1772,"])</script><script>self.__next_f.push([1,"{\"@context\":\"https://schema.org\",\"@graph\":[{\"@type\":\"WebSite\",\"@id\":\"https://salahu01.github.io/pawse/#website\",\"url\":\"https://salahu01.github.io/pawse/\",\"name\":\"Pawse\",\"description\":\"Pawse is a free, open-source macOS menu bar app. A cute 3D pet walks onto your screen to remind you to drink water, keep habits like stretching every 30 minutes, and take screen-time breaks, with an optio
